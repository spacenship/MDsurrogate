# Phase 1.6 3-seed confirmation -- Stage C. Not started automatically.
#
#   bash scripts/launch_phase1_6_full.sh          # seeds 0,1,2 on GPUs 4,5,6
#
# Every value shared with configs/phase1_5_full.yaml is the **same** value:
# the point of Phase 1.6 is the new arms, so a difference between a Phase 1.5 and
# a Phase 1.6 number must not be traceable to a budget or a manifest.
#
# The plan forbids starting this without an explicit request. The launcher
# exists so that request is one command rather than a reconstruction.

phase1:
  checkpoint: runs/phase1_full/last.pt   # NOT phase1_full_rerun: the Phase 1.5
                                         # numbers this is compared against were
                                         # produced against these weights, and
                                         # the two checkpoints hash differently
  expect_contract:
    physics_latent_irreps: 64x0e+16x1o+8x2e
    physics_latent_dim: 152
    frame: global
    target_scope: heavy_atom

data:
  data_dir: data
  esm2_cache_dir: esm2_cache
  quarantine_path: mdcath_force_quarantine.json
  coord_quarantine_path: mdcath_coord_quarantine.json
  ps_per_frame: 1000.0              # 1 ns/frame, from the mdCATH paper
  lags_ps: [1000.0, 4000.0]         # = 1 and 4 raw frames. Checked to be integral.
  history_length: 2                 # (t-1, t) -> t+lag
  max_residues: 250                 # the Phase 1 filter, so the split matches
  temperatures: null                # all five
  replicas: null                # all five
  pairs_per_trajectory: 8
  max_domains: null                 # all 726 train / 181 val
  val_fraction: 0.2
  split_seed: 0
  phase1_split_snapshot: runs/phase1_full/config_snapshot.json
  batch_size: 8
  num_workers: 8

model:
  arm: structure_only               # overridden per arm by the runner
  num_blocks: 3
  residue_knn: 16
  sequence_max_offset: 2
  backbone_cutoff: 13.0             # also the span of the pair distance basis
  use_plm: true
  use_temperature: true
  irreps:
    lmax: 2
    scalar_channels: 32
    vector_channels: 8
    tensor_channels: 4
  conditioner:
    d_cond: 64                      # identical for every arm, including the zero one
    hidden: 128
    atom_message_dim: 64
    uncertainty_gating: true
    # P0's hidden width is derived, not listed: matched_hidden_width() solves it
    # so the geometry control carries the physics arm's parameter count. A hand-set
    # number here would let the two drift apart silently.
    d_pair: 32
    pair_hidden: 128
    pair_message_dim: 64
    pair_relation_types: 6          # Phase 1's backbone relation vocabulary
    gate_hidden: 32

train:
  seed: 0
  learning_rate: 1.0e-3
  warmup_steps: 200
  lr_schedule: cosine
  min_lr_factor: 0.05
  max_steps: 40000
  eval_every: 2000
  log_every: 100
  eval_batches: 200
  checkpoint_every: 2000
  grad_clip: 10.0
  device: cuda:0
  future_physics_weight: 0.1        # P4 only; zeroed for every other arm by
                                    # build_configs, so no other arm pays for it
  future_physics_huber_delta: 1.0
  loss_weights:
    translation: 1.0
    rotation: 1.0
    pair_distance: 0.1
    clash: 0.0                      # measured clash rate is 0.000 on real pairs
    translation_scale_angstrom: 2.5 # measured mean |delta_r| over 1-4 ns pairs
    rotation_scale_radians: 0.59    # measured mean frame rotation (33.8 deg)
    rotation_loss: chordal          # smooth at theta = 0; geodesic is the metric
  metrics:
    contact_cutoff: 8.0
    contact_sequence_separation: 3
    clash_min_ca_distance: 3.6      # below the audited 3.67-4.01 A bonded CA-CA
