# Phase 1.6 H0 -- heavy-atom backmapping of the Stage B checkpoints.
#
#   python scripts/evaluate_phase1_6_h0.py --run runs/phase1_6_bounded_seed0 \
#       --config configs/phase1_6_h0.yaml --out runs/phase1_6_h0_seed0
#
# Data, split, manifest and model blocks are byte-identical to
# configs/phase1_6_bounded.yaml, because H0 must load the same validation pairs
# the checkpoints were trained against -- the runner asserts the manifest hash
# matches and aborts otherwise. Only the `h0:` block below is new; nothing here
# trains anything.
#
# Every value shared with configs/phase1_5_short.yaml is the **same** value:
# the point of Phase 1.6 is the new arms, so a difference between a Phase 1.5 and
# a Phase 1.6 number must not be traceable to a budget or a manifest.
#
# Bounded results are a direction, not a claim: one seed cannot separate arms
# whose Phase 1.5 siblings differed by 0.2%. What it decides is whether P1/P2
# move consistently against P0 -- the Stage C gate.

phase1:
  checkpoint: runs/phase1_full/last.pt   # NOT phase1_full_rerun: the Phase 1.5
                                         # numbers this is compared against were
                                         # produced against these weights, and
                                         # the two checkpoints hash differently
  expect_contract:
    physics_latent_irreps: 64x0e+16x1o+8x2e
    physics_latent_dim: 152
    frame: global
    target_scope: heavy_atom

data:
  data_dir: data
  esm2_cache_dir: esm2_cache
  quarantine_path: mdcath_force_quarantine.json
  coord_quarantine_path: mdcath_coord_quarantine.json
  ps_per_frame: 1000.0              # 1 ns/frame, from the mdCATH paper
  lags_ps: [1000.0, 4000.0]         # = 1 and 4 raw frames. Checked to be integral.
  history_length: 2                 # (t-1, t) -> t+lag
  max_residues: 250                 # the Phase 1 filter, so the split matches
  temperatures: null                # all five
  replicas: [0, 2, 4]               # three of five, to bound the pair count
  pairs_per_trajectory: 4
  max_domains: 120                  # train domains; validation gets max_domains/4
  val_fraction: 0.2
  split_seed: 0
  phase1_split_snapshot: runs/phase1_full/config_snapshot.json
  batch_size: 8
  num_workers: 4

model:
  arm: structure_only               # overridden per arm by the runner
  num_blocks: 3
  residue_knn: 16
  sequence_max_offset: 2
  backbone_cutoff: 13.0             # also the span of the pair distance basis
  use_plm: true
  use_temperature: true
  irreps:
    lmax: 2
    scalar_channels: 32
    vector_channels: 8
    tensor_channels: 4
  conditioner:
    d_cond: 64                      # identical for every arm, including the zero one
    hidden: 128
    atom_message_dim: 64
    uncertainty_gating: true
    # P0's hidden width is derived, not listed: matched_hidden_width() solves it
    # so the geometry control carries the physics arm's parameter count. A hand-set
    # number here would let the two drift apart silently.
    d_pair: 32
    pair_hidden: 128
    pair_message_dim: 64
    pair_relation_types: 6          # Phase 1's backbone relation vocabulary
    gate_hidden: 32

train:
  seed: 0
  learning_rate: 1.0e-3
  warmup_steps: 200
  lr_schedule: cosine
  min_lr_factor: 0.05
  max_steps: 6000
  eval_every: 500
  log_every: 100
  eval_batches: 60
  checkpoint_every: 1000
  grad_clip: 10.0
  device: cuda:0
  future_physics_weight: 0.1        # P4 only; zeroed for every other arm by
                                    # build_configs, so no other arm pays for it
  future_physics_huber_delta: 1.0
  loss_weights:
    translation: 1.0
    rotation: 1.0
    pair_distance: 0.1
    clash: 0.0                      # measured clash rate is 0.000 on real pairs
    translation_scale_angstrom: 2.5 # measured mean |delta_r| over 1-4 ns pairs
    rotation_scale_radians: 0.59    # measured mean frame rotation (33.8 deg)
    rotation_loss: chordal          # smooth at theta = 0; geodesic is the metric
  metrics:
    contact_cutoff: 8.0
    contact_sequence_separation: 3
    clash_min_ca_distance: 3.6      # below the audited 3.67-4.01 A bonded CA-CA


# ---------------------------------------------------------------------------
# H1b -- backbone frame constraint refiner.
#
# Everything above this line is byte-identical to configs/phase1_6_h0.yaml, and
# therefore to configs/phase1_6_bounded.yaml: H1b sits on the split its frozen
# coarse arm was trained against, and the runner refuses to start if the rebuilt
# manifest hash disagrees with the checkpoint's.
#
# This file is the SMOKE budget. It exists to answer "does the thing run, and can
# it move at all", not "does it work". Numbers from a run using this config are
# labelled is_smoke in the manifest and are not results.
# ---------------------------------------------------------------------------
h1b:
  # Which frozen arm to refine. P0 is the pair-geometry control: it had the best
  # backbone RMSD of the seven in H0 (3.1927 A vs 3.2116 for the oracle arm), so
  # a geometry gain measured on top of it cannot be explained away as slack the
  # coarse arm had left. Chosen before any H1b number exists.
  arm: P0_pair_geometry_control

  steps: 30
  smoke_steps: 50          # at or below this, the manifest says is_smoke
  log_every: 5
  learning_rate: 1.0e-3
  weight_decay: 0.0
  grad_clip: 10.0

  refiner:
    hidden: 128
    # Caps, not just penalties. An uncapped correction can move a residue
    # further than the whole 1 ns transition, at which point the coarse
    # prediction has stopped meaning anything and H1b is a model of its own.
    # 1.0 A against a measured mean |delta_r| of 2.5 A, and 15 deg against a
    # measured mean frame rotation of 33.8 deg: enough to fix a bond, not
    # enough to redo the transition.
    max_translation: 1.0
    max_rotation_rad: 0.2617993877991494   # 15 degrees
    predict_uncertainty: false

  # --- objective ---------------------------------------------------------
  # The primary term is the SAME loss the coarse arm was trained with, at full
  # weight. H1b is only worth having if it buys geometry without giving back
  # transition accuracy, so the original objective stays in and is reported
  # next to the frozen arm's own value every step.
  primary_weight: 1.0

  # Peptide geometry, measured against the CURRENT frame's own values -- there
  # is no ideal-geometry table in this repository and inventing one was
  # forbidden. Weight set before seeing a result; the smoke run only has to show
  # the term is finite, differentiable and decreasing.
  geometry_weight: 1.0
  bond_weight: 1.0          # angstrom^2
  angle_weight: 1.0         # radian^2

  # Steric overlap on the reconstructed N/CA/C. Deliberately small: H0 measured
  # that even a PERFECT frame prediction leaves 108.3 serious inter-residue
  # overlaps per structure against the identity baseline's 82.4, because the
  # side chains are still the stale ones. Driving this term to zero is therefore
  # not reachable by a frame refiner, and tuning towards zero would trade away
  # frame accuracy chasing a floor H1a owns.
  overlap_weight: 0.1
  overlap_tolerance: 0.4    # the MolProbity threshold the H0 metric reports at
  # |i - j| < 2 excluded. Stricter than the H0 metric, which keeps 1-4 pairs:
  # the training penalty is a strict subset of the reported one, so H1b cannot
  # lower its loss by rearranging pairs the metric would still count.
  overlap_min_separation: 2
