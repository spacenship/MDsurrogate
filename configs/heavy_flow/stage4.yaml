architecture_version: heavy_flow_v2_geometry_context_pair_messages
history:
  length: 3  # includes the current frame
  stride_frames: 1  # raw stored frames; independent of prediction lag
  missing_policy: repeat_earliest  # repeat frame 0 only; quarantined frames exclude the sample
# Stage 4: direct heavy-atom Cartesian conditional rectified flow.
# Stage 1--3 modules are loaded only for inference-time conditioning and are
# frozen by default; the flow decoder adapters and message blocks are trained.
stage: stage4_heavy_atom_flow
sequence_encoder:
  family: ESMC-300M
  backend: esmc
  model_name: models/ESMC-300M
  revision: local-ESMC-300M
  projected_dim: 64
  cache_only: true
  cache_dir: outputs/heavy_flow/esmc_cache
geometry:
  num_blocks: 4
  lmax: 2
  hidden_irreps: "96x0e + 24x1o + 8x1e + 8x2e"
graph:
  spatial_cutoff_angstrom: 6.0
  max_spatial_neighbors: 32
  include_covalent_edges: true
  include_chain_adjacent_edges: false
context:
  joint_scalar_dim: 384
  fusion_blocks: 4
  attention_heads: 8
  pair_bias: true
  dropout: 0.1
  geometry_modality_dropout: 0.1
  atom_refine_blocks: 2
  atom_refine_lmax: 2
  atom_refine_radial_basis: 16
  atom_refine_edge_embedding_dim: 8
physics:
  physics_blocks: 3
  lmax: 2
  scalar_dim: 64
  vector_channels: 8
  axial_channels: 4
  pair_dim: 32
  radial_basis: 16
  edge_embedding_dim: 8
  spatial_cutoff_angstrom: 6.0
  predict_force_mean: true
  predict_isotropic_force_variance: true
  use_pair_latent: true
force_head:
  logvar_min: -10.0
  logvar_max: 10.0
flow:
  flow_blocks: 6
  lmax: 2
  hidden_irreps: "64x0e + 16x1o + 4x1e + 4x2e"
  conditioning_layers: [0, 2, 4]
  radial_basis: 16
  edge_embedding_dim: 8
  spatial_cutoff_angstrom: 6.0
  max_spatial_neighbors: 32
  spatial_recompute_every: 1
  time_embedding_dim: 32
  atom_identity_dim: 8
  max_atomic_number: 118
  freeze_upstream: true
  sigma_scale: 0.1
  remove_center_of_mass_noise: true
  geometry_scale: 1.0
  geometry:
    bond_weight: 1.0
    angle_weight: 0.1
    peptide_weight: 0.1
    backbone_torsion_weight: 0.05
    sidechain_torsion_weight: 0.05
    chirality_weight: 0.05
    clash_weight: 0.02
    clash_min_distance: 1.5
solver:
  solver: heun
  steps: 20
  validation_num_samples: 8
data:
  future_lag_frames: 1  # decoder Delta-t; mdCATH stores 1000 ps per frame
  represented_scope: heavy_atom
  temporal_target: aligned_future
  no_target_in_conditioning: true
