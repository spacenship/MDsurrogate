[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "force-md"
version = "0.1.0.dev0"
description = "Force-conditioned protein MD ensemble model (hierarchical local physics + temporal transition)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1",
    "e3nn>=0.5",
    "numpy",
    "scipy",
    "PyYAML",
]

[project.optional-dependencies]
data = ["h5py", "huggingface_hub", "tqdm"]
plm = ["transformers"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: takes more than a few seconds",
    "cuda: requires a CUDA device",
    "mdcath: requires real mdCATH shards on disk",
]
